<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pit</title>
<meta name="description" content="Fill-ups, fuel economy, expenses and deadlines for your vehicles.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Pit v2 · carta, inchiostro, numeri in mono, un solo accento (rosso Pit).
     Il tema segue quello del dispositivo: chiaro "carta", scuro "notte in officina". */
  :root{
    color-scheme:light;
    --paper:#F7F5F1; --canvas:#EAE6DE; --card:#FFFFFF;
    --ink:#15140F; --on-ink:#FFFFFF; --ink-2:#605D55; --label:#6B6860; --faint:#6B6860; --ph:#ADA89D;
    --line:#E6E2DA; --line-2:#DDD8CE; --bar:#E0DBD2; --tag:#EDEAE3; --avg:#A9A498; --area:.07;
    --signal:#D6442B; --on-signal:#FFFFFF; --good:#2F7D5C; --neg:#D6442B;
    --warn-bg:#FFF6EE; --warn-line:#F0DCC6; --warn-sub:#7A6A55; --warn:#8A5E06;
    --bad-bg:#FCEFEB; --bad-line:#F1D2C9; --bad-sub:#86503F; --bad:#B8361F;
    --scan-bg:#15140F; --scan-tx:#FFFFFF; --scan-sub:#A8A59B; --dim:#6C6A62;
    --knob:#FFFFFF; --scrim:rgba(21,20,15,.42);
    --sh-sheet:0 -12px 40px rgba(20,18,12,.18); --sh-fab:0 10px 26px rgba(214,68,43,.34); --sh-toast:0 8px 24px rgba(20,18,12,.2);
    --sans:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --col:560px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --tabs-h:calc(46px + max(18px,var(--safe-b)));
  }
  @media(prefers-color-scheme:dark){
    :root{
      color-scheme:dark;
      --paper:#131211; --canvas:#0B0A09; --card:#1C1B18;
      --ink:#F4F1EA; --on-ink:#131211; --ink-2:#BEB9AE; --label:#A7A298; --faint:#827E74; --ph:#5E5A52;
      --line:#2B2926; --line-2:#302E2A; --bar:#32302B; --tag:#232220; --avg:#5B574F; --area:.08;
      --signal:#FF5A3D; --on-signal:#131211; --good:#55C08D; --neg:#FF7A5F;
      --warn-bg:#2A2118; --warn-line:#453424; --warn-sub:#C3B49C; --warn:#E6A93C;
      --bad-bg:#2C1916; --bad-line:#4D2A22; --bad-sub:#D7AB9E; --bad:#FF7A5F;
      --scan-bg:#26241F; --scan-tx:#F4F1EA; --scan-sub:#A7A298; --dim:#5B574F;
      --knob:#A7A298; --scrim:rgba(0,0,0,.6);
      --sh-sheet:0 -12px 40px rgba(0,0,0,.5); --sh-fab:0 10px 26px rgba(255,90,61,.30); --sh-toast:0 8px 24px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;background:var(--canvas)}
  body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);
    font:400 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  body.lock{overflow:hidden}
  button,input,select{font:inherit;color:inherit;margin:0}
  button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit;-webkit-appearance:none;appearance:none}
  h1,h2,h3,p{margin:0}
  a{color:var(--signal);text-decoration:none}
  [hidden]{display:none!important}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  input:focus-visible,select:focus-visible{outline:none} /* il focus lo mostra il riquadro del campo */
  .good{color:var(--good)!important} .bad-t{color:var(--neg)!important} .faint{color:var(--faint)!important}

  /* ---------- colonna app (su desktop resta una colonna centrata) ---------- */
  #app{max-width:var(--col);margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--paper);position:relative;
    padding-bottom:calc(var(--tabs-h) + 36px)}
  #app.fab-on{padding-bottom:calc(var(--tabs-h) + 104px)}
  #app.sub{padding-bottom:calc(40px + var(--safe-b))}
  @media(min-width:600px){#app{border-left:1px solid var(--line-2);border-right:1px solid var(--line-2)}}

  /* ---------- testi ricorrenti ---------- */
  .eyebrow{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--label)}
  .eyebrow.sm{font-size:11px;color:var(--faint)}
  .lab{font:500 12px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--label)}
  .lab .opt{text-transform:none;letter-spacing:0;color:var(--faint)}
  .hint{font-size:14px;line-height:1.45;color:var(--label);text-wrap:pretty}
  .hint code{font:500 12.5px var(--mono);background:var(--tag);border-radius:4px;padding:1px 5px;color:var(--ink-2)}
  .empty{font-size:14px;line-height:1.45;color:var(--label);text-align:center;padding:26px 14px;border:1px dashed var(--line-2);border-radius:14px;text-wrap:pretty}
  .plate{display:inline-block;font:500 12px var(--mono);letter-spacing:.05em;color:var(--label);background:var(--tag);border-radius:5px;padding:4px 7px;line-height:1.2}

  /* ---------- testata Panoramica ---------- */
  .top{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + var(--safe-t)) 24px 0}
  .veh-btn{display:flex;align-items:center;gap:9px;min-height:40px;min-width:0}
  .veh-btn .nm{font:600 19px var(--sans);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .caret{font:500 14px var(--sans);color:var(--faint)}
  .round{position:relative;flex:none;width:34px;height:34px;border-radius:999px;border:1px solid var(--bar);background:var(--card);
    display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
  .round::after{content:"";position:absolute;inset:-6px}
  .round .dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;border:2px solid var(--paper);background:var(--faint)}
  .round .dot.err{background:var(--signal)} .round .dot.busy{background:var(--warn)}

  /* ---------- numero eroe + istogramma ---------- */
  .hero{display:flex;flex-direction:column;gap:14px;padding:30px 24px 0;cursor:pointer}
  .hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .big{display:flex;align-items:baseline;gap:12px}
  .big .n{font:600 52px/1 var(--mono);letter-spacing:-.04em}
  .big .u{font:500 24px var(--mono);color:var(--faint)}
  .big.md{gap:10px} .big.md .n{font-size:48px} .big.md .u{font-size:22px}
  html[lang="en"] .big .u{order:-1;margin-right:-6px} /* in inglese il simbolo € va prima della cifra */
  .delta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--label)}
  .delta b{font:600 14px var(--mono);color:var(--ink-2)}
  .delta b.down{color:var(--good)} .delta b.up{color:var(--neg)}
  .bars{display:flex;align-items:flex-end;gap:10px;height:88px;margin-top:2px}
  .bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px}
  .bars .b{width:100%;border-radius:4px;background:var(--bar)}
  .bars .l{font:500 11px var(--mono);color:var(--faint);text-transform:uppercase}
  .bars .cur .b{background:var(--ink)} .bars .cur .l{font-weight:600;color:var(--ink)}

  /* ---------- consumo degli ultimi pieni (Panoramica) ---------- */
  .cons{display:flex;flex-direction:column;gap:9px;padding:20px 24px 0;cursor:pointer}
  .cons-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .cons-h b{font:600 15px var(--mono);white-space:nowrap}
  .cons-h b i{font:400 12px var(--sans);font-style:normal;color:var(--label)}
  .cons-plot{position:relative;height:84px}
  .cons-plot svg{position:absolute;inset:0;width:100%;height:84px;overflow:visible}
  .cons-dot{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--signal)}
  .cons-f{display:flex;justify-content:space-between;gap:12px;font:500 11px var(--mono);color:var(--label);text-transform:uppercase}
  .cons-f .up{color:var(--good)} .cons-f .dn{color:var(--neg)}
  .cons .empty{padding:16px 12px}

  /* ---------- indicatori ---------- */
  .kpis{display:flex;gap:10px;padding:18px 24px 0}
  .kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:24px 24px 0}
  .kpi{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 13px;display:flex;flex-direction:column;gap:5px}
  .kpi .k{font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--label);white-space:nowrap}
  .kpi .v{font:600 22px var(--mono);letter-spacing:-.02em;white-space:nowrap}
  .kpi .u{font-size:12px;color:var(--faint)}
  @media(max-width:360px){.kpi .v{font-size:18px}}

  /* ---------- card a riga (scadenza, ultimo pieno) ---------- */
  .stack{display:flex;flex-direction:column;gap:10px;padding:14px 24px 0}
  .note{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .note .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
  .note .t{font:600 16px var(--sans)}
  .note .s{font-size:13px;color:var(--label)}
  .note .r{flex:none;font:600 17px var(--mono)}
  .note .r.bdg{font-size:14px;color:var(--label)}
  .note.warn{background:var(--warn-bg);border-color:var(--warn-line)} .note.warn .s{color:var(--warn-sub)} .note.warn .r{color:var(--warn)}
  .note.bad{background:var(--bad-bg);border-color:var(--bad-line)} .note.bad .s{color:var(--bad-sub)} .note.bad .r{color:var(--bad)}
  .mini{flex:none;background:var(--ink);color:var(--on-ink);border-radius:11px;padding:10px 14px;font:600 14px var(--sans)}

  /* ---------- pagine lista ---------- */
  .page{display:flex;flex-direction:column;gap:16px;padding:calc(24px + var(--safe-t)) 24px 0}
  .page-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .page-head h1{font:600 28px var(--sans);letter-spacing:-.02em}
  .veh-eb{align-self:flex-start;margin-bottom:-10px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:2px 0}
  .yearsel{position:relative;font:500 13px var(--mono);color:var(--label);padding:8px 0 8px 10px;white-space:nowrap}
  .yearsel select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer;-webkit-appearance:none;appearance:none}
  .stats{display:flex;gap:22px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .stats>span{display:flex;flex-direction:column;gap:3px;min-width:0}
  .stats b{font:600 19px var(--mono);white-space:nowrap}
  .stats i{font-style:normal;font-size:12px;color:var(--label)}
  .list{display:flex;flex-direction:column;gap:12px;padding:20px 24px 0}
  .list .grp:not(:first-child){margin-top:8px}
  .rows{display:flex;flex-direction:column;gap:9px}
  .row{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
  .row .dt{flex:none;width:34px;display:flex;flex-direction:column;align-items:center}
  .row .dt b{font:600 17px var(--mono)}
  .row .dt span{font:500 10px var(--mono);color:var(--faint);text-transform:uppercase}
  .row .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .row .mid b{font:600 16px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .mid span{font-size:13px;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .mid span.mono{font-family:var(--mono)}
  .row .end{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .row .end b{font:600 17px var(--mono)}
  .row .end span{font:500 12px var(--mono);color:var(--label)}
  .cats{display:flex;flex-direction:column;gap:16px;padding:26px 24px 0}
  .cat{display:flex;flex-direction:column;gap:9px}
  .cat-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .cat-h span{font:500 16px var(--sans)} .cat-h b{font:600 16px var(--mono)}
  .track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
  .track div{height:6px;border-radius:3px;background:var(--ink)}
  .sec{display:flex;flex-direction:column;gap:10px;padding:26px 24px 0}
  .sec.tight{padding-top:14px}
  .foot{padding:30px 24px 0;text-align:center;font-size:13px;color:var(--faint)}

  /* ---------- gruppi a righe (impostazioni, distributori) ---------- */
  .group{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .srow{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 17px;border-top:1px solid var(--line)}
  .srow:first-child{border-top:0}
  .srow .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .srow .mid b{font:600 16px var(--sans)}
  .srow .mid b .plate{margin-left:6px;vertical-align:2px}
  .srow .mid span{font-size:13px;color:var(--label)}
  .srow .st{flex:none;font:500 13px var(--mono);color:var(--label)}
  .srow .st.big{font:600 16px var(--mono);color:var(--ink)}
  .srow .chev{flex:none;font:400 20px var(--sans);color:var(--faint);line-height:1}
  .srow.add .mid b{color:var(--signal)}
  .srow.danger .mid b{color:var(--bad)}
  .on-dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--signal)}

  /* ---------- sottopagine (Analisi, Impostazioni) ---------- */
  .subhead{display:flex;align-items:center;gap:10px;padding:calc(20px + var(--safe-t)) 24px 0}
  .subhead h1{font:600 28px var(--sans);letter-spacing:-.02em}
  .back{flex:none;width:36px;height:36px;margin-left:-8px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px 10px}
  .panel .empty{border:0;padding:22px 10px}
  svg.chart{width:100%;height:auto;display:block;font-family:var(--mono)}
  /* colori dei grafici SVG: seguono il tema tramite le variabili */
  .g-grid{stroke:var(--line)} .g-axis{fill:var(--faint)} .g-avg{stroke:var(--avg)}
  .g-line{fill:none;stroke:var(--ink)} .g-area{fill:var(--ink);fill-opacity:var(--area)}
  .g-dot{fill:var(--ink)} .g-last{fill:var(--signal)}
  .g-lab{fill:var(--ink);stroke:var(--card);paint-order:stroke}
  .g-bar{fill:var(--bar)} .g-bar.cur{fill:var(--ink)} .g-axis.cur{fill:var(--ink)}
  .vf{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
  .vf:first-child{border-top:0}
  .vf span{flex:1;font:500 15px var(--sans)} .vf b{font:600 15px var(--mono)} .vf i{font-style:normal;font-size:12px;color:var(--label);min-width:74px;text-align:right}

  /* ---------- barra schede + pulsante + ---------- */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:var(--col);margin:0 auto;display:flex;
    background:var(--card);border-top:1px solid var(--line);padding:12px 16px max(18px,var(--safe-b))}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px;font:500 13px var(--sans);color:var(--label);white-space:nowrap}
  .tabs button i{display:block;width:20px;height:3px;border-radius:2px;background:transparent}
  .tabs button.on{font-weight:600;color:var(--ink)} .tabs button.on i{background:var(--signal)}
  .fab{position:fixed;z-index:41;width:58px;height:58px;border-radius:999px;background:var(--signal);color:var(--on-signal);
    display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-fab);
    bottom:calc(var(--tabs-h) + 24px);right:max(22px,calc((100vw - var(--col)) / 2 + 22px))}
  .fab:active{transform:scale(.96)}

  /* ---------- pulsanti ---------- */
  .btn{width:100%;display:flex;align-items:center;justify-content:center;border-radius:14px;padding:19px;font:600 17px var(--sans);color:var(--on-ink);background:var(--ink)}
  .btn.red{background:var(--signal);color:var(--on-signal)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .lnk{display:block;width:100%;text-align:center;font:500 15px var(--sans);color:var(--label);padding:6px}
  .lnk.red{color:var(--bad)}
  .inl{font:inherit;color:var(--signal);font-weight:600;text-decoration:underline;text-underline-offset:2px}

  /* ---------- chip di scelta ---------- */
  .chips{display:flex;gap:9px;flex-wrap:wrap}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--ink-2);border-radius:11px;padding:13px 20px;font:500 16px var(--sans)}
  .chips.fuel .chip{padding:13px 18px}
  .chips.sm{gap:8px} .chips.sm .chip{padding:10px 14px;font-size:15px;border-radius:10px}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}

  /* ---------- campi ---------- */
  .fields{display:flex;flex-direction:column;gap:14px}
  .frow{display:flex;gap:10px}
  .field{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;gap:4px;cursor:text;
    background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
  .field.grow{flex:1.4}
  .field:focus-within{border-color:var(--ink);box-shadow:0 0 0 .5px var(--ink)}
  .field>span:first-child{font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--label)}
  .field input{width:100%;min-width:0;border:0;background:transparent;padding:0;font:600 24px var(--mono);color:var(--ink);border-radius:0}
  .field input::placeholder,.inp::placeholder,.kmbox input::placeholder{color:var(--ph);opacity:1}
  .field.txt input{font:500 17px var(--sans)}
  .field.txt input.plate-in{font:500 17px var(--mono);letter-spacing:.06em;text-transform:uppercase}
  .field .val{font:500 17px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .field .val.sans{font-family:var(--sans)}
  .field.pick{cursor:pointer}
  .field.pick input,.field.pick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer;display:block;-webkit-appearance:none;appearance:none}
  .kmline{display:flex;align-items:baseline;gap:8px;min-width:0}
  .kmline input{width:auto;flex:none}
  .kmline em{font-style:normal;font-size:13px;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kmline em.up{color:var(--good)} .kmline em.no{color:var(--neg)}
  .switch{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;font:500 16px var(--sans)}
  .switch input{position:absolute;opacity:0;pointer-events:none}
  .switch i{flex:none;width:48px;height:28px;border-radius:999px;background:var(--line-2);display:flex;align-items:center;padding:3px;transition:background .15s}
  .switch i::after{content:"";width:22px;height:22px;border-radius:999px;background:var(--knob);box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform .15s,background .15s}
  .switch input:checked+i{background:var(--ink)} .switch input:checked+i::after{transform:translateX(20px);background:var(--on-ink)}
  .switch input:focus-visible+i{outline:2px solid var(--ink);outline-offset:2px}
  .inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px 18px;font:500 18px var(--sans);color:var(--ink)}
  .inp:focus{border-color:var(--ink);box-shadow:0 0 0 .5px var(--ink)}
  .inp.plate-in{font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .err{border-color:var(--signal)!important;box-shadow:0 0 0 .5px var(--signal)!important;animation:shake .22s 2}
  .err-msg{font-size:14px;color:var(--bad);margin-top:-18px}

  /* ---------- sheet dal basso ---------- */
  .scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:var(--col);margin:0 auto;
    display:flex;flex-direction:column;gap:20px;background:var(--paper);border-radius:30px 30px 0 0;
    box-shadow:var(--sh-sheet);padding:14px 24px calc(24px + var(--safe-b));
    max-height:calc(100vh - 40px);max-height:calc(100dvh - 24px - var(--safe-t));overflow-y:auto;overscroll-behavior:contain;
    transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s}
  .sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
  .handle{flex:none;align-self:center;width:44px;height:4px;border-radius:2px;background:var(--line-2)}
  .sh-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .sh-head h3{font:600 24px var(--sans);letter-spacing:-.02em}
  .sh-head button{font:500 15px var(--sans);color:var(--label);padding:6px 0 6px 12px}
  .sh-sep{display:flex;align-items:center;gap:12px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .sh-sep::before,.sh-sep::after{content:"";flex:1;height:1px;background:var(--line-2)}
  .scan{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--scan-bg);border-radius:14px;padding:15px 18px}
  .scan:disabled{opacity:.7}
  .scan-ic{flex:none;width:32px;height:32px;border-radius:8px;border:1.5px solid var(--dim);display:flex;align-items:center;justify-content:center;color:var(--scan-tx)}
  .scan-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .scan-tx b{font:600 15px var(--sans);color:var(--scan-tx)}
  .scan-tx span{font-size:13px;color:var(--scan-sub)}
  .scan-ar{flex:none;color:var(--dim);display:flex}
  .scan-msg{margin-top:-8px;font-size:14px;line-height:1.45;color:var(--label)}
  .scan-msg.good{color:var(--good)} .scan-msg.warn{color:var(--warn)} .scan-msg.bad{color:var(--bad)}
  .total{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
  .total span{font-size:15px;color:var(--label)}
  .total b{font:600 26px var(--mono);letter-spacing:-.02em}
  .pick-card{width:100%;display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .pick-card b{font:600 16px var(--sans)} .pick-card span{font-size:13px;color:var(--label)}

  /* ---------- wizard primo avvio ---------- */
  .wizard{position:fixed;inset:0;z-index:50;background:var(--canvas);overflow-y:auto}
  .wz{max-width:var(--col);margin:0 auto;min-height:100%;background:var(--paper);display:flex;flex-direction:column}
  .wz-step{flex:1;display:flex;flex-direction:column;animation:wzin .28s ease}
  @keyframes wzin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  .wz-welcome{justify-content:space-between;gap:32px;padding:calc(40px + var(--safe-t)) 32px calc(44px + var(--safe-b))}
  .logo{font:600 20px var(--sans);letter-spacing:-.02em}
  .logo i{font-style:normal;color:var(--signal)}
  .wz-hero{display:flex;flex-direction:column;gap:18px}
  .wz-hero h1{font:600 40px/1.08 var(--sans);letter-spacing:-.03em;text-wrap:pretty}
  .wz-hero p{font-size:17px;line-height:1.5;color:var(--ink-2);text-wrap:pretty}
  .wz-prog{display:flex;align-items:center;gap:16px;padding:calc(26px + var(--safe-t)) 32px 0}
  .wz-prog button{flex:none;display:flex;margin-left:-6px;padding:4px;color:var(--ink)}
  .wz-prog button.dim{color:var(--label)}
  .wz-prog .track{flex:1;height:3px;background:var(--bar);border-radius:2px}
  .wz-prog .fill{height:3px;background:var(--signal);border-radius:2px;transition:width .3s ease}
  .wz-prog .cnt{font:500 13px var(--mono);color:var(--label)}
  .wz-body{flex:1;display:flex;flex-direction:column;gap:30px;padding:36px 32px calc(44px + var(--safe-b))}
  .wz-body.tight{gap:26px}
  .wz-body h2{font:600 32px/1.12 var(--sans);letter-spacing:-.025em;text-wrap:pretty}
  .wz-fields{display:flex;flex-direction:column;gap:22px}
  .wz-f{display:flex;flex-direction:column;gap:9px}
  .wz-cta{margin-top:auto;display:flex;flex-direction:column;gap:13px}
  .kmbox{display:flex;align-items:baseline;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:20px 18px;cursor:text}
  .kmbox:focus-within{border-color:var(--ink);box-shadow:0 0 0 .5px var(--ink)}
  .kmbox input{flex:none;min-width:0;max-width:100%;border:0;background:transparent;padding:0;font:600 38px var(--mono);letter-spacing:-.02em;color:var(--ink)}
  .kmbox span{font:500 18px var(--mono);color:var(--faint)}
  .scadrows{display:flex;flex-direction:column;gap:10px}
  .scadrow{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px}
  .scadrow:focus-within{border-color:var(--ink)}
  .scadrow b{font:500 17px var(--sans)}
  .scadrow span{font:500 16px var(--mono)}
  .scadrow span.none{color:var(--faint)}
  .scadrow input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;display:block;-webkit-appearance:none;appearance:none}
  .ready{display:flex;flex-direction:column;gap:5px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:13px;padding:16px 18px}
  .ready b{font:600 15px var(--sans)} .ready span{font-size:14px;line-height:1.45;color:var(--warn-sub)}

  /* ---------- avviso breve ---------- */
  .toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));z-index:80;transform:translate(-50%,-8px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--on-ink);font:500 14px var(--sans);padding:10px 16px;border-radius:999px;white-space:nowrap;
    box-shadow:var(--sh-toast);transition:opacity .2s,transform .2s}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
<main>

  <!-- ===================== PANORAMICA ===================== -->
  <section data-page="panoramica">
    <header class="top">
      <button class="veh-btn" onclick="openSwitch()" data-i18n-aria="ov.switchVeh">

      </button>
      <button class="round" onclick="navTo('impostazioni')" data-i18n-aria="set.title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span class="dot" id="sync-dot" hidden></span>
      </button>
    </header>
    <div class="hero" role="button" tabindex="0" onclick="navTo('analisi')" onkeydown="if(event.key==='Enter')navTo('analisi')" data-i18n-aria="ov.openAnalysis">

      <div class="big"><span class="n" id="o-amt">0,00</span><span class="u">€</span></div>
      <div class="delta" id="o-delta"></div>
      <div class="bars" id="o-bars"></div>
    </div>
    <div class="cons" id="o-cons" role="button" tabindex="0" onclick="navTo('analisi')" onkeydown="if(event.key==='Enter')navTo('analisi')" data-i18n-aria="ov.consAria"></div>
    <div class="kpis" id="o-kpis"></div>
    <div class="stack" id="o-cards"></div>
  </section>

  <!-- ===================== PIENI ===================== -->
  <section data-page="pieni" hidden>
    <div class="page">
      <button class="veh-eb" onclick="openSwitch()" hidden></button>
      <div class="page-head">
        <h1 data-i18n="tab.pieni"></h1>
        <label class="yearsel"><span id="yp-txt"></span> ▾<select id="yp" onchange="setYear('p',this.value)" data-i18n-aria="year"></select></label>
      </div>
      <div class="stats" id="pl-stats"></div>
    </div>
    <div class="list" id="pl-list"></div>
    <div class="sec" id="pl-st" hidden>
      <div class="eyebrow sm" id="pl-st-h"></div>
      <div class="chips sm" id="pl-st-fuel"></div>
      <div class="group" id="pl-st-list"></div>
      <p class="hint" id="pl-st-hint"></p>
    </div>
  </section>

  <!-- ===================== SPESE ===================== -->
  <section data-page="spese" hidden>
    <div class="page" style="gap:18px">
      <button class="veh-eb" onclick="openSwitch()" hidden></button>
      <div class="page-head">
        <h1 data-i18n="tab.spese"></h1>
        <label class="yearsel"><span id="ys-txt"></span> ▾<select id="ys" onchange="setYear('s',this.value)" data-i18n-aria="year"></select></label>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <span class="eyebrow" data-i18n="sp.beyond"></span>
        <div class="big md"><span class="n" id="s-amt">0,00</span><span class="u">€</span></div>
        <span class="hint" id="s-sub"></span>
      </div>
    </div>
    <div class="cats" id="s-cats"></div>
    <div class="sec" style="gap:10px">
      <span class="eyebrow sm" id="s-list-h" data-i18n="sp.latest"></span>
      <div class="rows" id="s-list"></div>
    </div>
  </section>

  <!-- ===================== SCADENZE ===================== -->
  <section data-page="scadenze" hidden>
    <div class="page">
      <button class="veh-eb" onclick="openSwitch()" hidden></button>
      <div class="page-head"><h1 data-i18n="tab.scadenze"></h1></div>
      <p class="hint" data-i18n="sc.hint"></p>
    </div>
    <div class="list"><div class="rows" id="sc-list"></div></div>
  </section>

  <!-- ===================== ANALISI ===================== -->
  <section data-page="analisi" hidden>
    <div class="subhead">
      <button class="back" onclick="goBack()" data-i18n-aria="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg></button>
      <h1 data-i18n="an.title"></h1>
    </div>
    <div class="kgrid" id="a-kpis"></div>
    <div class="sec"><span class="eyebrow sm" data-i18n="an.byMonth"></span><div class="panel"><div id="ch-mese"></div></div></div>
    <div class="sec"><span class="eyebrow sm" id="a-cons-h"></span><div class="panel"><div id="ch-consumo"></div></div><p class="hint" data-i18n="an.consHint"></p></div>
    <div class="sec"><span class="eyebrow sm" id="a-prezzo-h"></span><div class="chips sm" id="a-fuel"></div><div class="panel"><div id="ch-prezzo"></div></div><div class="group" id="a-byfuel" style="padding:4px 14px" hidden></div></div>
    <div class="sec"><span class="eyebrow sm" data-i18n="an.eurKm"></span><div class="panel"><div id="ch-eurkm"></div></div></div>
  </section>

  <!-- ===================== IMPOSTAZIONI ===================== -->
  <section data-page="impostazioni" hidden>
    <div class="subhead">
      <button class="back" onclick="goBack()" data-i18n-aria="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg></button>
      <h1 data-i18n="set.title"></h1>
    </div>
    <div class="sec"><span class="eyebrow sm" data-i18n="set.vehicles"></span><div class="group" id="st-veh"></div></div>
    <div class="sec"><span class="eyebrow sm" data-i18n="set.lang"></span><div class="group" id="st-lang"></div></div>
    <div class="sec"><span class="eyebrow sm" data-i18n="set.scan"></span>
      <div class="group"><button class="srow" onclick="openAI()"><span class="mid"><b data-i18n="set.aiKey"></b><span data-i18n="set.aiKeySub"></span></span><span class="st" id="st-ai"></span><span class="chev">›</span></button></div>
    </div>
    <div class="sec"><span class="eyebrow sm" data-i18n="set.sync"></span>
      <div class="group"><button class="srow" onclick="openSync()"><span class="mid"><b>GitHub Gist</b><span data-i18n="set.syncSub"></span></span><span class="st" id="st-sync"></span><span class="chev">›</span></button></div>
    </div>
    <div class="sec"><span class="eyebrow sm" data-i18n="set.data"></span>
      <div class="group">
        <button class="srow" onclick="exportJSON()"><span class="mid"><b data-i18n="set.backup"></b><span data-i18n="set.backupSub"></span></span><span class="chev">›</span></button>
        <button class="srow" onclick="$('imp').click()"><span class="mid"><b data-i18n="set.import"></b><span data-i18n="set.importSub"></span></span><span class="chev">›</span></button>
        <button class="srow" onclick="exportCSV()"><span class="mid"><b data-i18n="set.csv"></b><span id="st-csv"></span></span><span class="chev">›</span></button>
        <button class="srow danger" onclick="clearAll()"><span class="mid"><b data-i18n="set.clear"></b><span data-i18n="set.clearSub"></span></span></button>
      </div>
    </div>
    <p class="foot" data-i18n="set.foot"></p>
  </section>

</main>

<button class="fab" id="fab" onclick="fabAction()" data-i18n-aria="add" hidden>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<nav class="tabs" id="tabs">
  <button data-page="panoramica" onclick="navTo('panoramica')"><span data-i18n="tab.panoramica"></span><i></i></button>
  <button data-page="pieni" onclick="navTo('pieni')"><span data-i18n="tab.pieni"></span><i></i></button>
  <button data-page="spese" onclick="navTo('spese')"><span data-i18n="tab.spese"></span><i></i></button>
  <button data-page="scadenze" onclick="navTo('scadenze')"><span data-i18n="tab.scadenze"></span><i></i></button>
</nav>
</div>

<!-- ===================== WIZARD PRIMO AVVIO ===================== -->
<div class="wizard" id="wizard" hidden>
  <div class="wz">
    <section class="wz-step wz-welcome" id="wz0">
      <div class="logo">Pit<i>.</i></div>
      <div class="wz-hero">
        <h1 data-i18n="wz.h1"></h1>
        <p data-i18n="wz.lead"></p>
      </div>
      <div class="wz-cta" style="gap:14px">
        <button class="btn" onclick="wzGo(1)" data-i18n="wz.start"></button>
        <button class="lnk" onclick="openRestore()" data-i18n="wz.haveBackup"></button>
      </div>
    </section>

    <div class="wz-prog" id="wz-prog" hidden>
      <button id="wz-back" onclick="wzBack()" data-i18n-aria="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg></button>
      <div class="track"><div class="fill" id="wz-fill"></div></div>
      <span class="cnt" id="wz-cnt">1/3</span>

    <section class="wz-step" id="wz1" hidden>
      <div class="wz-body">

          <div class="wz-f"><span class="lab" data-i18n="f.type"></span><div class="chips" id="wz-type"></div></div>
          <label class="wz-f"><span class="lab"><span data-i18n="f.plate"></span> <span class="opt" data-i18n="f.optional"></span></span><input class="inp plate-in" id="wz-plate" data-i18n-ph="wz.platePh" autocomplete="off" autocapitalize="characters" enterkeyhint="done"></label>
        </div>
        <p class="err-msg" id="wz-name-err" data-i18n="wz.nameErr" hidden></p>
        <div class="wz-cta"><button class="btn" onclick="wzNext()" data-i18n="wz.next"></button></div>
      </div>
    </section>

    <section class="wz-step" id="wz2" hidden>
      <div class="wz-body">
        <h2 data-i18n="wz.q2"></h2>
        <div class="wz-f"><span class="lab" data-i18n="f.fuel"></span><div class="chips fuel" id="wz-fuel"></div></div>
        <div class="wz-f">
          <span class="lab" data-i18n="f.odo"></span>

          <span class="hint" data-i18n="wz.kmHint"></span>

        <div class="wz-cta"><button class="btn" onclick="wzNext()" data-i18n="wz.next"></button></div>
      </div>
    </section>

    <section class="wz-step" id="wz3" hidden>
      <div class="wz-body tight">
        <div style="display:flex;flex-direction:column;gap:10px">
          <h2 data-i18n="wz.q3"></h2>
          <p class="hint" style="font-size:15px" data-i18n="wz.scadHint"></p>
        </div>
        <div class="scadrows" id="wz-scad"></div>
        <div class="ready"><b id="wz-ready-t"></b><span id="wz-ready-s"></span></div>
        <div class="wz-cta">
          <button class="btn" onclick="wzFinish(true)" data-i18n="wz.addFirst"></button>
          <button class="lnk" onclick="wzFinish(false)" data-i18n="wz.later"></button>
        </div>
      </div>

</div>

<!-- ===================== SHEET ===================== -->
<div class="scrim" id="scrim" onclick="closeSheet()"></div>

    <span class="scan-tx"><b data-i18n="scan.title"></b><span data-i18n="scan.sub"></span></span>
    <span class="scan-ar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>

      <label class="field"><span id="pn-price-l"></span><input id="pn-prezzo" inputmode="decimal" autocomplete="off"></label>
    </div>
    <label class="field"><span data-i18n="f.odo"></span><span class="kmline"><input id="pn-km" inputmode="numeric" placeholder="0" autocomplete="off"><em id="pn-km-hint"></em></span></label>

      <label class="field pick"><span data-i18n="f.date"></span><b class="val" id="pn-data-txt">—</b><input type="date" id="pn-data" data-i18n-aria="f.date"></label>

    <div class="frow">
      <label class="field pick"><span data-i18n="f.fuel"></span><b class="val sans" id="pn-tipo-txt"></b><select id="pn-tipo" data-i18n-aria="f.fuel"></select></label>

  </div>
  <datalist id="benzlist"></datalist>
  <div class="total"><span data-i18n="total"></span><b id="pn-tot">—</b></div>
  <button class="btn red" id="pn-save" onclick="savePieno()"></button>
  <button class="lnk red" id="pn-del" onclick="delPieno()" data-i18n="pn.del" hidden></button>
</div>

<div class="sheet" id="sh-spesa" role="dialog" aria-modal="true" aria-labelledby="sp-title">
  <span class="handle"></span>
  <div class="sh-head"><h3 id="sp-title"></h3><button onclick="closeSheet()" data-i18n="cancel"></button></div>
  <div class="chips sm" id="sp-cat"></div>
  <div class="fields">
    <label class="field"><span data-i18n="sp.amount"></span><input id="sp-imp" inputmode="decimal" autocomplete="off"></label>
    <div class="frow">
      <label class="field pick"><span data-i18n="f.date"></span><b class="val" id="sp-data-txt">—</b><input type="date" id="sp-data" data-i18n-aria="f.date"></label>
      <label class="field txt grow"><span data-i18n="sp.desc"></span><input id="sp-desc" data-i18n-ph="sp.descPh" autocomplete="off"></label>
    </div>

function fmt(n,d){if(n==null||!isFinite(n))return'—';d=d==null?2:d;const neg=n<0;const p=Math.abs(n).toFixed(d).split('.'),L=LOC();

function blankVehicle(o){o=o||{};return{id:genId(),name:o.name||t('veh.default'),type:o.type||'auto',plate:o.plate||'',fuel:o.fuel||'',
  kmStart:o.kmStart==null?null:o.kmStart,rif:[],spese:[],scadenze:[]};}

// migra qualsiasi formato salvato/importato al modello v2 (zero perdita dati)
function migrate(d){
  if(!d||typeof d!=='object')return null;
  if(Array.isArray(d.vehicles)){
    d.v=2;
    d.vehicles.forEach(v=>{v.id=v.id||genId();v.name=v.name||t('veh.default');v.type=v.type||'auto';v.plate=v.plate||'';v.fuel=v.fuel||'';
      if(v.kmStart===undefined)v.kmStart=null;v.rif=v.rif||[];v.spese=v.spese||[];v.scadenze=v.scadenze||[];});
    if(!d.vehicles.length)d.vehicles=[blankVehicle({name:t('veh.defaultN',{n:1})})];
    if(!d.vehicles.some(v=>v.id===d.currentId))d.currentId=d.vehicles[0].id;
    d.updatedAt=d.updatedAt||0;
    return d;
  }
  if(Array.isArray(d.rif)){ // vecchio formato piatto (v1) o backup legacy
    const v=blankVehicle({name:t('veh.defaultN',{n:1})});v.rif=d.rif;v.spese=d.spese||[];v.scadenze=d.scadenze||[];
    return{v:2,example:!!d.example,updatedAt:d.updatedAt||0,currentId:v.id,vehicles:[v]};
  }
  return null;
}

// ---------- calcoli (sul veicolo attivo) ----------
function computed(){
  const V=cur();
  const rif=V.rif.map((r,oi)=>({...r,oi})).sort((a,b)=>a.km-b.km||a.data.localeCompare(b.data));
  // consumo "da pieno a pieno": i km/l si misurano tra due pieni, sommando
  // tutta la benzina messa in mezzo (rabbocchi parziali compresi). Un rabbocco
  // (pieno=false) non ha un suo km/l: i suoi litri confluiscono nel pieno dopo.
  let prev=null,lastFull=null,accL=0,accC=0;
  const rows=rif.map(r=>{
    const costo=r.litri*r.prezzo,kmP=prev!=null?r.km-prev:null;prev=r.km;
    const full=r.pieno!==false;
    accL+=r.litri;accC+=costo;
    let kmL=null,l100=null,eurKm=null,seg=null;
    if(full&&lastFull!=null){
      const dist=r.km-lastFull;
      if(dist>0&&accL>0){kmL=dist/accL;l100=accL/dist*100;eurKm=accC/dist;seg={dist,l:accL};}
    }
    if(full){lastFull=r.km;accL=0;accC=0;}
    return{...r,costo,kmP,full,kmL,l100,eurKm,seg};
  });
  const wd=rows.filter(r=>r.kmP!=null&&r.kmP>0),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
  const spesaCarb=sum(rows,r=>r.costo),litriTot=sum(rows,r=>r.litri),kmTot=sum(wd,r=>r.kmP),
        litriDist=sum(wd,r=>r.litri),costoDist=sum(wd,r=>r.costo),speseTot=sum(V.spese,s=>s.imp);
  // medie €/l per tipo di carburante (separate: tipi diversi non sono confrontabili)
  const fm={};
  rows.forEach(r=>{const t=r.tipo||'Altro';(fm[t]=fm[t]||{litri:0,costo:0,n:0});fm[t].litri+=r.litri;fm[t].costo+=r.costo;fm[t].n++;});
  const byFuel=Object.keys(fm).map(t=>({tipo:t,avg:fm[t].costo/fm[t].litri,litri:fm[t].litri,n:fm[t].n,costo:fm[t].costo})).sort((a,b)=>b.litri-a.litri);
  return{rows,byFuel,fuelTypes:byFuel.map(f=>f.tipo),spesaCarb,litriTot,kmTot,speseTot,nRif:rows.length,
    kmLavg:kmTot&&litriDist?kmTot/litriDist:null,l100avg:kmTot&&litriDist?litriDist/kmTot*100:null,
    eurKmAvg:kmTot?costoDist/kmTot:null,totale:spesaCarb+speseTot};
}

function scadStatus(iso){

  if(isNaN(days))return{days:9e9,cls:'',badge:''};
  return{days,cls:days<0?'bad':days<=30?'warn':'',badge:days<0?t('sc.overdue'):days===0?t('sc.today'):tp(days,'sc.days')};
}

function renderPanoramica(c){
  const V=cur(),now=new Date(),y=now.getFullYear(),m=now.getMonth()+1;
  const mt=monthTotals(c),tot=k=>mt[k]||0;
  const pmY=m===1?y-1:y,pmM=m===1?12:m-1,curT=tot(mkey(y,m)),prevT=tot(mkey(pmY,pmM));
  $('o-month').textContent=monthName(m)+' '+y;
  const n=fmt(curT,2);$('o-amt').textContent=n;$('o-amt').style.fontSize=n.length>8?'42px':'';
  // in italiano "ad" davanti a vocale (ad agosto, a settembre): per questo ci sono due varianti delle frasi
  const pm=monthName(pmM),vw=/^[aeiou]/.test(pm)?'V':'';
  if(prevT>0&&curT===0)$('o-delta').innerHTML=`<span>${t('ov.nothingYet',{month:pm,amt:eur(prevT)})}</span>`;
  else if(prevT>0){
    const dir=curT<prevT?'down':curT>prevT?'up':'';
    $('o-delta').innerHTML=`<b class="${dir}">${dir==='down'?'↓ ':dir==='up'?'↑ ':''}${Math.round(Math.abs(curT-prevT)/prevT*100)}%</b><span>${t('ov.vsPrev'+vw,{month:pm,amt:eur(prevT)})}</span>`;
  }else $('o-delta').innerHTML=`<span>${t('ov.none'+vw,{month:pm})}</span>`;
  const cols=lastMonths(6),mx=Math.max(0,...cols.map(x=>tot(x.k)));
  $('o-bars').innerHTML=cols.map(x=>{const v=tot(x.k),h=mx?Math.max(3,Math.round(v/mx*66)):3;
    return `<div class="col${x.cur?' cur':''}" title="${monthName(x.m)}: ${eur(v)}"><div class="b" style="height:${h}px"></div><span class="l">${monthShort(x.m)}</span></div>`;}).join('');

  // consumo degli ultimi 6 pieni misurati; la linea tratteggiata è la media di sempre
  const pf=primaryFuel(V,c),u=unitOf(pf),avg=c.kmLavg;
  const meas=c.rows.filter(r=>r.kmL!=null).sort((a,b)=>a.data.localeCompare(b.data)||a.km-b.km).slice(-6);
  let ch=`<div class="cons-h"><span class="eyebrow">${meas.length>1?t('ov.consLast',{n:meas.length}):t('ov.cons')}</span>${avg?`<b>${fmt(avg,1)} <i>${t('avgUnit',{u})}</i></b>`:''}</div>`;
  if(meas.length>1){
    const vals=meas.map(r=>r.kmL),all=avg?vals.concat([avg]):vals;
    let lo=Math.min(...all),hi=Math.max(...all);if(hi-lo<.2){const mid=(hi+lo)/2;lo=mid-.1;hi=mid+.1;}
    const W=342,last=vals.length-1,X=i=>6+i*(330/last),Y=v=>15+(hi-v)/(hi-lo)*47.5;

    const avgL=avg?`<line class="g-avg" x1="6" y1="${Y(avg).toFixed(1)}" x2="336" y2="${Y(avg).toFixed(1)}" stroke-width="1" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>`:'';
    ch+=`<div class="cons-plot"><svg viewBox="0 0 ${W} 84" preserveAspectRatio="none" aria-hidden="true">`
      +`<path class="g-area" d="M${pts[0]} L${pts.slice(1).join(' ')} L${X(last)},84 L6,84 Z"/>${avgL}`
      +`<polyline class="g-line" points="${pts.join(' ')}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`
      +`<i class="cons-dot" style="left:${(X(last)/W*100).toFixed(2)}%;top:${Y(vals[last]).toFixed(1)}px"></i></div>`;

  const last=c.rows.slice().sort((a,b)=>b.data.localeCompare(a.data)||b.km-a.km)[0];

  else h+=`<div class="note"><span class="tx"><b class="t">${t('ov.noFill')}</b><span class="s">${t('ov.noFillSub')}</span></span><button class="mini" onclick="openPieno()">${t('add')}</button></div>`;

function renderPieni(c){
  const V=cur(),pf=primaryFuel(V,c),u=unitOf(pf);
  const years=yearsOf(c.rows.map(r=>r.data));
  if(!(yearP==='all'||years.includes(yearP)))yearP=years[0];
  fillYear('yp','yp-txt',years,yearP);
  const rows=c.rows.filter(r=>inYear(r.data,yearP)).sort((a,b)=>b.data.localeCompare(a.data)||b.km-a.km);
  const segs=rows.filter(r=>r.seg),dist=segs.reduce((s,r)=>s+r.seg.dist,0),lit=segs.reduce((s,r)=>s+r.seg.l,0);
  $('pl-stats').innerHTML=`<span><b>${rows.length}</b><i>${tp(rows.length,'pl.fill')}</i></span>`
    +`<span><b>${eur(rows.reduce((s,r)=>s+r.costo,0))}</b><i>${t('pl.spent')}</i></span>`
    +`<span><b>${lit?fmt(dist/lit,1):'—'}</b><i>${t('avgUnit',{u})}</i></span>`;
  // migliore e peggiore del periodo, solo se c'è abbastanza storia per dirlo
  const meas=rows.filter(r=>r.kmL!=null);let best=null,worst=null;
  if(meas.length>=3){best=meas.reduce((a,b)=>b.kmL>a.kmL?b:a);worst=meas.reduce((a,b)=>b.kmL<a.kmL?b:a);}
  if(!rows.length){
    $('pl-list').innerHTML=`<p class="empty">${c.rows.length?t('pl.emptyPeriod'):t('pl.empty')}</p>`;
  }else{
    const groups=[];
    rows.forEach(r=>{const k=r.data.slice(0,7);let g=groups[groups.length-1];if(!g||g.k!==k){g={k,rows:[]};groups.push(g);}g.rows.push(r);});
    $('pl-list').innerHTML=groups.map(g=>{const{y,m}=ymd(g.k+'-01');
      return `<span class="eyebrow sm grp">${monthName(m)}${yearP==='all'?' '+y:''}</span><div class="rows">${g.rows.map(r=>rowPieno(r,best,worst)).join('')}</div>`;}).join('');

}
function rowPieno(r,best,worst){

  return `<button class="row" onclick="openPieno(${r.oi})"><span class="dt"><b>${pad2(d)}</b><span>${monthShort(m)}</span></span>`
    +`<span class="mid"><b>${esc(r.benz||valLabel(r.tipo)||t('pn.fallback'))}</b><span class="mono">${fmtMax(r.litri,2)} ${u} · ${fmt(r.prezzo,3)} €/${u}</span></span>`
    +`<span class="end"><b>${fmt(r.costo,2)}</b>${eff}</span></button>`;
}
// confronto distributori: dentro Pieni, sul periodo scelto e per un carburante alla volta
function renderStations(rows,pf){

  const st={};
  withSt.filter(r=>(r.tipo||'Altro')===stFuel).forEach(r=>{const k=r.benz.trim();(st[k]=st[k]||{l:0,c:0,n:0});st[k].l+=r.litri;st[k].c+=r.costo;st[k].n++;});
  const list=Object.keys(st).map(k=>({nome:k,avg:st[k].c/st[k].l,n:st[k].n})).sort((a,b)=>a.avg-b.avg),u=unitOf(stFuel);

// ---------- grafici SVG (nessuna dipendenza) ----------
function lineChart(id,data,o){
  const el=$(id);
  if(data.length<2){el.innerHTML=`<p class="empty">${data.length?t('ch.needMore'):t('ch.noData')}</p>`;return;}
  const W=480,H=190,p={l:46,r:14,t:24,b:26};
  const ys=data.map(d=>d.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){const e=Math.abs(mn)*.05||1;mn-=e;mx+=e;}
  const rg=mx-mn;mn-=rg*.15;mx+=rg*.15;
  const li=data.length-1,X=i=>p.l+i/li*(W-p.l-p.r),Y=v=>p.t+(1-(v-mn)/(mx-mn))*(H-p.t-p.b);
  let g='';for(let t=0;t<=3;t++){const v=mn+(mx-mn)*t/3,y=Y(v);
    g+=`<line class="g-grid" x1="${p.l}" y1="${y}" x2="${W-p.r}" y2="${y}"/><text class="g-axis" x="${p.l-8}" y="${y+3.5}" font-size="10" text-anchor="end">${fmt(v,o.dec)}</text>`;}
  const pts=data.map((d,i)=>`${X(i)},${Y(d.y)}`);
  const area=`M ${X(0)},${H-p.b} L ${pts.join(' L ')} L ${X(li)},${H-p.b} Z`;
  const dots=data.map((d,i)=>`<circle class="${i===li?'g-last':'g-dot'}" cx="${X(i)}" cy="${Y(d.y)}" r="${i===li?4:2.6}"/>`).join('');
  const lab=`<text class="g-lab" x="${X(li)}" y="${Y(data[li].y)-10}" font-size="11" font-weight="600" text-anchor="end" stroke-width="4" stroke-linejoin="round">${fmt(data[li].y,o.dec)}</text>`;
  const step=Math.ceil(data.length/6),show=i=>i===li||(i%step===0&&li-i>=step*.6);
  const xl=data.map((d,i)=>show(i)?`<text class="g-axis" x="${X(i)}" y="${H-7}" font-size="10" text-anchor="${i===0?'start':i===li?'end':'middle'}">${shortDate(d.x).slice(0,5)}</text>`:'').join('');
  el.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}<path class="g-area" d="${area}"/><polyline class="g-line" points="${pts.join(' ')}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${lab}${xl}</svg>`;
}
function barChart(id,data){
  const el=$(id);
  if(!data.some(d=>d.y>0)){el.innerHTML='<p class="empty">'+t('ch.noSpend')+'</p>';return;}
  const W=480,H=190,p={l:4,r:4,t:22,b:24},bw=(W-p.l-p.r)/data.length,mx=Math.max(...data.map(d=>d.y))||1;
  el.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`+data.map((d,i)=>{
    const h=Math.max(d.y>0?3:2,d.y/mx*(H-p.t-p.b)),x=p.l+i*bw+bw*.16,w=bw*.68,y=H-p.b-h,cur=d.cur?' cur':'';
    return `<rect class="g-bar${cur}" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/>`
      +(d.y>0?`<text class="g-axis${cur}" x="${x+w/2}" y="${y-6}" font-size="9.5" text-anchor="middle">${fmt(d.y,0)}</text>`:'')
      +`<text class="g-axis${cur}" x="${x+w/2}" y="${H-7}" font-size="10" text-anchor="middle"${d.cur?' font-weight="600"':''}>${d.l.toUpperCase()}</text>`;
  }).join('')+'</svg>';
}

// ---------- navigazione ----------
const TABS=['panoramica','pieni','spese','scadenze'],SUBS=['analisi','impostazioni'];
let page='panoramica',lastTab='panoramica';
function showPage(name){
  if(name==='rifornimenti')name='pieni';
  if(!TABS.includes(name)&&!SUBS.includes(name))name='panoramica';
  page=name;if(TABS.includes(name))lastTab=name;
  document.querySelectorAll('main > section').forEach(s=>{s.hidden=s.dataset.page!==name;});
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.page===name));
  const sub=SUBS.includes(name),fab=['pieni','spese','scadenze'].includes(name);
  $('tabs').hidden=sub;$('fab').hidden=!fab;
  $('app').classList.toggle('sub',sub);$('app').classList.toggle('fab-on',fab);
  window.scrollTo(0,0);
}
function navTo(name){if((location.hash.slice(1)||'panoramica')===name)showPage(name);else location.hash=name;}
function goBack(){navTo(lastTab);}
window.addEventListener('hashchange',()=>showPage(location.hash.slice(1)||'panoramica'));
function fabAction(){if(page==='pieni')openPieno();else if(page==='spese')openSpesa();else if(page==='scadenze')openScad();}

  $('pn-litri').value=r?fNum(r.litri):'';$('pn-prezzo').value=r?fNum(r.prezzo):'';

// km del pieno precedente (o i km di partenza del veicolo) per il "+297 km dall'ultimo"
function prevKm(km){
  const V=cur(),others=V.rif.filter((_,j)=>j!==editRif).map(r=>r.km).filter(n=>isFinite(n));
  const below=editRif!=null&&isFinite(km)?others.filter(n=>n<km):others;
  if(below.length)return Math.max(...below);
  if(others.length&&editRif==null)return Math.max(...others);
  return V.kmStart!=null&&isFinite(V.kmStart)?V.kmStart:null;
}
function updPieno(){

// numero da testo/numero, tollerante ai formati ("1,85" / "1.234,56" / 14)
function toNum(v){if(v==null)return null;if(typeof v==='number')return isFinite(v)?v:null;
  let s=String(v).replace(/[^\d.,-]/g,'');
  if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(','))s=s.replace(',','.');
  const n=parseFloat(s);return isFinite(n)?n:null;}

// immagine -> JPEG base64 ridimensionato (meno banda, meno costo, orientamento corretto)
function fileToJpeg(file,maxDim,quality){return new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);
    let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
    const s=Math.min(1,maxDim/Math.max(w,h));
    w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    resolve(c.toDataURL('image/jpeg',quality).split(',')[1]);};
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error(t('ai.errImg')));};
  img.src=url;});}

const RECEIPT_PROMPT='Sei un assistente che legge scontrini di rifornimento carburante (italiani). Estrai i dati dalla foto e rispondi SOLO con un oggetto JSON, senza testo ne markdown, con esattamente questi campi: {"data":"AAAA-MM-GG o null","litri":numero o null,"prezzo_litro":numero o null,"importo":numero o null,"benzinaio":"testo o null","carburante":"testo o null"}. Regole: usa il punto come separatore decimale; "litri" e la quantita erogata, "prezzo_litro" il prezzo al litro (di norma tra 0.3 e 4 euro), "importo" il totale pagato; "benzinaio" e la marca/insegna (es. Eni, Q8, IP, Esso); "carburante" il tipo (es. Benzina, Diesel, GPL); non inventare nulla, usa null se un dato non e leggibile.';

function parseAIJson(txt){
  if(!txt)throw new Error(t('ai.errEmpty'));
  let s=String(txt).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a>=0&&b>a)s=s.slice(a,b+1);
  try{return JSON.parse(s);}catch(e){throw new Error(t('ai.errParse'));}}

async function aiErr(r){let m='';try{const e=await r.json();m=(e.error&&(e.error.message||e.error.type))||'';}catch(_){}
  if(r.status===401||r.status===403)return t('ai.errKey');
  if(r.status===429)return t('ai.errLimit');
  return t('ai.errStatus',{status:r.status,msg:m?': '+m:''});}

async function aiAnthropic(key,model,b64){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','content-type':'application/json'},
    body:JSON.stringify({model,max_tokens:512,messages:[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
      {type:'text',text:RECEIPT_PROMPT}]}]})});
  if(!r.ok)throw new Error(await aiErr(r));
  const d=await r.json();
  return parseAIJson((d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(''));}

async function aiOpenAI(key,model,b64){
  const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',
    headers:{'Authorization':'Bearer '+key,'content-type':'application/json'},
    body:JSON.stringify({model,max_tokens:512,messages:[{role:'user',content:[
      {type:'text',text:RECEIPT_PROMPT},
      {type:'image_url',image_url:{url:'data:image/jpeg;base64,'+b64}}]}]})});
  if(!r.ok)throw new Error(await aiErr(r));
  const d=await r.json();const m=((d.choices||[])[0]||{}).message;
  return parseAIJson((m&&m.content)||'');}

async function aiGoogle(key,model,b64){
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key),{method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:RECEIPT_PROMPT},{inline_data:{mime_type:'image/jpeg',data:b64}}]}]})});
  if(!r.ok)throw new Error(await aiErr(r));
  const d=await r.json();
  const parts=((((d.candidates||[])[0]||{}).content||{}).parts)||[];
  return parseAIJson(parts.map(x=>x.text||'').join(''));}

function extractWithAI(b64){
  const p=AI.provider||'anthropic',model=(AI.model||AI_DEFAULTS[p]),key=AI.key;
  if(p==='anthropic')return aiAnthropic(key,model,b64);
  if(p==='openai')return aiOpenAI(key,model,b64);
  if(p==='google')return aiGoogle(key,model,b64);
  return Promise.reject(new Error(t('ai.errProv')));}

async function scanReceipt(input){
  const f=input.files&&input.files[0];input.value='';
  if(!f)return;
  const btn=$('scan-btn');btn.disabled=true;
  try{
    showScan(t('scan.prep'));
    const b64=await fileToJpeg(f,1600,0.8);
    showScan(t('scan.reading'));
    const r=await extractWithAI(b64),got=[];
    if(r.data&&/^\d{4}-\d{2}-\d{2}$/.test(r.data)){$('pn-data').value=r.data;got.push('data');}
    let litri=toNum(r.litri),prezzo=toNum(r.prezzo_litro),importo=toNum(r.importo);
    if(litri==null&&prezzo&&importo)litri=importo/prezzo;
    if(prezzo==null&&litri&&importo)prezzo=importo/litri;
    if(litri!=null&&litri>0&&litri<300){$('pn-litri').value=litri.toFixed(2).replace('.',LOC().dec);got.push('litri');}
    if(prezzo!=null&&prezzo>=0.3&&prezzo<=4){$('pn-prezzo').value=prezzo.toFixed(3).replace('.',LOC().dec);got.push('prezzo');}
    if(r.benzinaio){$('pn-benz').value=String(r.benzinaio);got.push('benzinaio');}
    if(r.carburante){const f=String(r.carburante).toLowerCase(),os=[...$('pn-tipo').options],hit=v=>{v=v.toLowerCase();return v.includes(f)||f.includes(v.split(' ')[0]);};
      const opt=os.find(o=>hit(o.value))||os.find(o=>hit(o.textContent));if(opt)$('pn-tipo').value=opt.value;}
    updPieno();
    if(got.length){showScan(t('scan.got',{fields:got.map(k=>t('scan.f.'+k)).join(', ')}),'good');$('pn-km').focus();}
    else showScan(t('scan.none'),'warn');
  }catch(e){showScan(esc(e.message||t('scan.err')),'bad');}
  finally{btn.disabled=false;}
}

    await syncPull(true);setSync('ok');render();
    $('sync-token').value='';closeSheet();toast(t('sync.onToast'));
  }catch(e){SYNC={};setSync('off');$('sync-err').textContent=t('sync.checkScope',{msg:e.message});}
}
function disableSync(){if(!confirm(t('sync.offConfirm')))return;SYNC={};saveSyncCfg();setSync('off');closeSheet();}
// legge il file dal Gist (anche quando GitHub lo tronca nella risposta)
async function gistContent(id){
  const g=await gh('/gists/'+id),f=g.files&&g.files[GIST_FILE];if(!f)return null;
  return f.truncated&&f.raw_url?await(await fetch(f.raw_url)).text():f.content;
}
async function syncPull(adopt){
  if(!syncOn())return;
  const content=await gistContent(SYNC.gistId);
  if(content==null){if(adopt)await syncPush();return;}
  let remote;try{remote=JSON.parse(content);}catch(e){return;}
  if(remote&&(remote.updatedAt||0)>(DB.updatedAt||0)){const mig=migrate(remote);if(mig){DB=mig;persistLocal();render();}}
  else if(adopt){await syncPush();}
}
async function syncPush(){
  if(!syncOn())return;
  await gh('/gists/'+SYNC.gistId,{method:'PATCH',body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(DB)}}})});
}
function schedulePush(){if(!syncOn())return;clearTimeout(pushTimer);setSync('pending');pushTimer=setTimeout(doPush,1500);}
async function doPush(){try{setSync('syncing');await syncPush();setSync('ok');}catch(e){setSync('error',e.message);}}
async function syncNow(){try{setSync('syncing');await syncPull();await syncPush();setSync('ok');}catch(e){setSync('error',e.message);}}
// dal wizard: collega un Gist esistente e ne scarica i dati (non crea niente se non li trova)
async function restoreGist(){
  const token=$('rs-token').value.trim();if(!token)return bad('rs-token');
  const msg=$('rs-msg'),go=$('rs-go');msg.style.color='';msg.textContent=t('rs.searching');go.disabled=true;
  SYNC={token};
  try{
    const gists=await gh('/gists?per_page=100'),g=gists.find(x=>x.files&&x.files[GIST_FILE]);
    if(!g)throw new Error(t('rs.notFound'));
    const content=await gistContent(g.id);let d=null;try{d=migrate(JSON.parse(content));}catch(e){}
    if(!d)throw new Error(t('rs.unreadable'));
    SYNC.gistId=g.id;saveSyncCfg();
    DB=d;DB.example=false;persistLocal();yearP=yearS=null;
    closeSheet();closeWizard();render();setSync('ok');navTo('panoramica');toast(t('rs.done'));
  }catch(e){SYNC={};msg.style.color='var(--bad)';msg.textContent=e.message+'.';}
  finally{go.disabled=false;}
}

  var _hadCtrl=!!navigator.serviceWorker.controller, _swReloaded=false;

  navigator.serviceWorker.addEventListener('controllerchange',function(){if(!_hadCtrl||_swReloaded)return;_swReloaded=true;location.reload();});

}
